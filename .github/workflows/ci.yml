name: usb_hid CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get (plugin)
        run: flutter pub get

      - name: Flutter pub get (example)
        run: flutter pub get
        working-directory: example

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

  build-linux-web:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libhidapi-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get (plugin)
        run: flutter pub get

      - name: Flutter pub get (example)
        run: flutter pub get
        working-directory: example

      - name: Enable desktop targets
        run: flutter config --enable-linux-desktop

      - name: Build example (linux)
        run: flutter build linux
        working-directory: example

      - name: Build example (web)
        run: flutter build web
        working-directory: example

      - name: Upload linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: usb_hid-example-linux
          path: example/build/linux/**/release/bundle

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: usb_hid-example-web
          path: example/build/web

  build-windows:
    runs-on: windows-latest
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get (plugin)
        run: flutter pub get

      - name: Flutter pub get (example)
        run: flutter pub get
        working-directory: example

      - name: Enable desktop target
        run: flutter config --enable-windows-desktop

      - name: Build example (windows)
        run: flutter build windows
        working-directory: example

      - name: Upload windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: usb_hid-example-windows
          path: example/build/windows/**/Release

  build-macos-ios:
    runs-on: macos-latest
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get (plugin)
        run: flutter pub get

      - name: Flutter pub get (example)
        run: flutter pub get
        working-directory: example

      - name: Enable desktop target
        run: flutter config --enable-macos-desktop

      - name: Build example (macOS)
        run: flutter build macos
        working-directory: example

      - name: Build example (iOS, no codesign)
        run: flutter build ios --no-codesign
        working-directory: example

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: usb_hid-example-macos
          path: example/build/macos/Build/Products/Release

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: usb_hid-example-ios
          path: example/build/ios/iphoneos
